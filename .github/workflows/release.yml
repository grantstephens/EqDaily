# Builds a signed APK on tag push and attaches it to a GitHub Release
# (pre-release when the tag has a suffix, e.g. v0.1.0-beta.1).
#
# Required repository secrets (see README.md "Releases" for how to set them):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  check:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          # Matches the pin in mise.toml.
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - run: npm run check

  release:
    name: Signed APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # apksigner and aapt (used by tools/verify-release-apk.sh) live in the
      # Android SDK's build-tools, which is not on PATH by default.
      - name: Configure Android toolchain
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      # versionCode is a packed integer derived from the tag, so it strictly
      # increases across alpha < beta < rc < final and rebuilding a tag
      # reproduces it. See tools/compute-version.sh.
      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          eval "$(tools/compute-version.sh "$TAG")"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "name=$versionName"  >> "$GITHUB_OUTPUT"
          echo "code=$versionCode"  >> "$GITHUB_OUTPUT"
          echo "Building $TAG as versionName=$versionName versionCode=$versionCode"

      # expo prebuild bakes app.json's version / android.versionCode into the
      # generated gradle files. sed, not a JSON round trip, so the file's
      # formatting is untouched. Asserts both edits landed.
      - name: Set app.json version
        run: |
          sed -i -e '/"version"/s/1\.0\.0/${{ steps.version.outputs.name }}/' \
                 -e '/"android": {/a "versionCode": ${{ steps.version.outputs.code }},' app.json
          grep -q '"versionCode": ${{ steps.version.outputs.code }}' app.json
          grep -q '"version": "${{ steps.version.outputs.name }}"' app.json

      - name: Prebuild the native Android project
        run: npx expo prebuild --platform android --no-install

      # expo prebuild signs "release" with the debug keystore by default and
      # regenerates android/ every run, so the real signing config is patched
      # in each time. The script asserts its anchors, so a template change
      # fails loudly instead of shipping a debug-signed "release".
      - name: Patch release signing config
        run: python3 tools/patch-release-signing.py

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See README.md 'Releases'."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      # Real phones only (arm64 + 32-bit arm): skipping x86 ABIs roughly halves
      # the native build time and the download.
      - name: Build signed APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Name and verify the APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk \
             "eqdaily-${{ steps.version.outputs.tag }}.apk"
          tools/verify-release-apk.sh "eqdaily-${{ steps.version.outputs.tag }}.apk" \
            "${{ steps.version.outputs.code }}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: eqdaily-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
